# nginx 限流区定义
#
# ⚠️ `limit_req_zone` 只能写在 http 上下文里，不能写在 server 块里 ——
#    所以单独放这个文件（Ubuntu 的 /etc/nginx/nginx.conf 默认会 include conf.d/*.conf）。
#
# 装法：
#   sudo cp nginx-tlblog-limits.conf /etc/nginx/conf.d/tlblog-limits.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 为什么把限流放在 nginx 而不是应用里：
#   · 所有 worker 共享计数，真的能挡住；应用内的内存计数在 edge 运行时**不保证跨请求共享**
#   · 和运行时无关，升级 Next、重启应用都不影响
#   · 应用层被绕过的可能性（伪造成本）都比不了这一层

# 💬 AI 猫聊天：正常聊天几分钟一次，30 次/分钟对真人绰绰有余
limit_req_zone $binary_remote_addr zone=tl_blog_chat:10m rate=30r/m;

# 🔁 Gitalk 换 token：正常登录一次就一次，10 次/分钟足够
limit_req_zone $binary_remote_addr zone=tl_blog_oauth:10m rate=10r/m;
