# 博客前台的反向代理（Ubuntu 22.04 + nginx）
#
# 装法（setup-server.sh 会做）：
#   sudo cp nginx-tlblog.conf /etc/nginx/sites-available/tlblog.conf
#   sudo ln -sf /etc/nginx/sites-available/tlblog.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 只是本机/局域网看的话，其实不装 nginx 也行：直接访问 http://<虚拟机IP>:3000
#
# ⚠️ 文件末尾 certbot 那几行是 HTTPS 证书，**不要删**。

server {

    #   改成你的域名（跑 setup-https.sh 会自动改）。只看 IP 就先留 _;
    server_name blog.torinlinsley.top;

    # 上传图片可能比较大
    client_max_body_size 64m;

    # 🛡️ 安全响应头（2026-10-06 加）
    #    ⚠️ nginx 的 add_header **不继承**：某个 location 里只要自己写了 add_header，
    #       server 块这里的就**全都**不生效 —— 所以下面 /_next/static/ 和 /uploads/
    #       各自又抄了一遍（这是 nginx 的经典坑，不是写重复了）。
    #    ⚠️ 故意**不含 includeSubDomains**：一旦下发，子域名没有证书就会打不开。
    #       想加子域等确认所有子域都有证书再说。
    #    ⚠️ 故意**先不开 CSP**：站内有内联脚本、图床外链、Gitalk，
    #       加急了会把页面打坏。要开先只上报（Content-Security-Policy-Report-Only）。
    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 静态资源让 nginx 直接发，省一层 Node
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # 本层有自己的 add_header → 安全头不会继承，补一遍（见上面说明）
        add_header Strict-Transport-Security "max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # 👇 上传的图片：让浏览器长期缓存（文件名都带时间戳，不会互相覆盖）
    #    ⚠️ proxy_hide_header 那行不能少：Next 对 public/ 下的文件发的是
    #       `Cache-Control: public, max-age=0`，不丢掉它的话下面的 add_header
    #       会变成两个 Cache-Control，浏览器仍按 max-age=0 走 —— 等于白加。
    #    ⚠️ 故意不带 always：只在 2xx/304 上加，免得图片还没同步上去时的 404
    #       也被浏览器缓存 30 天。
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000";
        # 同上：本层有自己的 add_header，安全头得补一遍
        add_header Strict-Transport-Security "max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # 💬 AI 猫：这个接口用服务器上的 AI Key 花钱，必须限流
    #    限流区定义在 /etc/nginx/conf.d/tlblog-limits.conf（limit_req_zone 只能写在 http 上下文）
    #    注：应用里也有同源校验；这里这层是真正可靠的限流（所有 worker 共享计数）
    location = /api/chat {
        limit_req zone=tl_blog_chat burst=6 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 🔁 Gitalk 换 token 的代理：原来是开放中继，同样限流
    location = /api/github {
        limit_req zone=tl_blog_oauth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    listen [::]:443 ssl ipv6only=on http2; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/blog.torinlinsley.top/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/blog.torinlinsley.top/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = torinlinsley.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = blog.torinlinsley.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name blog.torinlinsley.top torinlinsley.top;
    return 404; # managed by Certbot




}
