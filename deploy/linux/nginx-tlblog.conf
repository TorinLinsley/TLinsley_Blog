# 博客前台的反向代理（Ubuntu 22.04 + nginx）
#
# 装法（setup-server.sh 会做）：
#   sudo cp nginx-tlblog.conf /etc/nginx/sites-available/tlblog.conf
#   sudo ln -sf /etc/nginx/sites-available/tlblog.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 只是本机/局域网看的话，其实不装 nginx 也行：直接访问 http://<虚拟机IP>:3000
#
# ⚠️ 签完 HTTPS（setup-https.sh / certbot）之后，certbot 会往这个文件里加这几行：
#       listen [::]:443 ssl ipv6only=on; # managed by Certbot
#       listen 443 ssl;                  # managed by Certbot
#       ssl_certificate / ssl_certificate_key / include options-ssl-nginx.conf / ssl_dhparam
#    记得在那两行 listen 末尾补上 **http2**（`listen 443 ssl http2;`）：
#    一份页面要下十几个 JS/CSS + 图片 + 字体分片，HTTP/2 的多路复用对
#    跨境访客差别很大（HTTP/1.1 只能 6 条连接排队）。certbot 加的那几行别删。

server {
    listen 80;
    listen [::]:80;

    # ⚠️ 改成你的域名（跑 setup-https.sh 会自动改）。只看 IP 就先留 _;
    server_name _;

    # 证书签好、确认 https 稳定之后想开 HSTS 就放开下面这行
    # ⚠️ 一旦下发，浏览器一年内强制 https（子域名也要有证书），别急着开
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 上传图片可能比较大
    client_max_body_size 64m;

    # 静态资源让 nginx 直接发，省一层 Node
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 👇 上传的图片：让浏览器长期缓存（文件名都带时间戳，不会互相覆盖）
    #    ⚠️ proxy_hide_header 那行不能少：Next 对 public/ 下的文件发的是
    #       `Cache-Control: public, max-age=0`，不丢掉它的话下面的 add_header
    #       会变成两个 Cache-Control，浏览器仍按 max-age=0 走 —— 等于白加，
    #       表现就是"访客每次打开都要重新下几 MB 图片"。
    #    ⚠️ 故意不带 always：只在 2xx/304 上加，免得图片还没同步上去时的 404
    #       也被浏览器缓存 30 天。
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;

        # 🛡️ 安全响应头（2026-10-06 加）
        #    说明：nginx 的 add_header **不继承** —— 只要本层自己写了任何 add_header，
        #    上层（server 块）的就全都不生效。所以上面两个带 add_header 的 location
        #    （/_next/static/ 和 /uploads/）要单独再加一遍，见那两个块里的注释。
        #
        #    ⚠️ 故意**不含 HSTS 的 includeSubDomains**：一旦下发，浏览器一年内强制 https，
        #       子域名没有证书就会打不开。要开先只开 max-age，确认没问题再考虑加子域。
        add_header Strict-Transport-Security "max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # ⚠️ CSP 故意先不开：站内有内联脚本、图床外链、Gitalk 等，
        #    加急了会把页面打坏。要开先只上报（Content-Security-Policy-Report-Only）。
    }

    # 💬 AI 猫：这个接口用服务器上的 AI Key 花钱，必须限流
    #    （限流区定义在 /etc/nginx/conf.d/tlblog-limits.conf）
    location = /api/chat {
        limit_req zone=tl_blog_chat burst=6 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 🔁 Gitalk 换 token 的代理：同样限流（原来是开放中继）
    location = /api/github {
        limit_req zone=tl_blog_oauth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
